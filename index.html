<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيثيريا AI - Aetheria AI</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0d0b14; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121019; }
        ::-webkit-scrollbar-thumb { background: #3b2a5c; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#0d0b14] text-white min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_CHARACTERS = [
            {
                id: '1',
                name: 'إيثيريا AI - Aetheria AI',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80',
                systemPrompt: 'أنت إيثيريا، رفيقة الذكاء الاصطناعي الذكية واللطيفة. تتحدثين بجميع اللغات وبأسلوب أنمي شيق ومتفاعل.',
                firstMessage: 'النور والظلام يلتفان حولنا.. من يقف أمامي اليوم؟',
                category: 'أنمي',
                tags: ['#fantasy', '#romance', '#Rpg'],
                stats: '💎 34.9K'
            },
            {
                id: '2',
                name: 'كايتو - Kaito Fantasy',
                avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&auto=format&fit=crop&q=80',
                systemPrompt: 'أنت كايتو، ساحر وفارس غامض وشجاع من عالم الخيال والأنمي. تتحدث بحكمة وجاذبية عالية.',
                firstMessage: 'أهلاً بك أيها المسافر في عوالمي الغامضة. هل أنت مستعد للمغامرة؟',
                category: 'خيال',
                tags: ['#fantasy', '#Royal', '#Darkromance'],
                stats: '💎 12.8K'
            }
        ];

        function App() {
            const [currentTab, setCurrentTab] = useState('explore');
            const [characters, setCharacters] = useState(() => {
                const saved = localStorage.getItem('aetheria_chars');
                return saved ? JSON.parse(saved) : INITIAL_CHARACTERS;
            });
            const [activeChat, setActiveChat] = useState(() => characters[0]);
            const [messages, setMessages] = useState(() => [
                { id: '1', text: characters[0].firstMessage, isUser: false }
            ]);
            const [inputText, setInputText] = useState('');
            const [loading, setLoading] = useState(false);

            const [userPersonaName, setUserPersonaName] = useState(() => localStorage.getItem('aetheria_uname') || 'Victoria');
            const [userPersonaDesc, setUserPersonaDesc] = useState(() => localStorage.getItem('aetheria_udesc') || 'الاسم: فيكتوريا\nالجنس: أنثى\nالعمر: ٢١ سنة');
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('aetheria_apikey') || '');
            const [allow18, setAllow18] = useState(() => localStorage.getItem('aetheria_18') === 'true');

            const [complaintType, setComplaintType] = useState('خطأ تقني أو برمجية');
            const [complaintText, setComplaintText] = useState('');
            const [complaintSent, setComplaintSent] = useState(false);

            const [botName, setBotName] = useState('');
            const [botAvatar, setBotAvatar] = useState('');
            const [botPrompt, setBotPrompt] = useState('');
            const [botFirstMsg, setBotFirstMsg] = useState('');

            useEffect(() => {
                localStorage.setItem('aetheria_chars', JSON.stringify(characters));
            }, [characters]);

            const handleSaveProfile = () => {
                localStorage.setItem('aetheria_uname', userPersonaName);
                localStorage.setItem('aetheria_udesc', userPersonaDesc);
                localStorage.setItem('aetheria_apikey', apiKey);
                localStorage.setItem('aetheria_18', allow18);
                alert('تم حفظ المفتاح والإعدادات بنجاح! ✨');
            };

            const startChat = (char) => {
                setActiveChat(char);
                setMessages([{ id: Date.now().toString(), text: char.firstMessage, isUser: false }]);
                setCurrentTab('chat');
            };

            const handleSendMessage = async () => {
                if (!inputText.trim()) return;
                const userMsg = { id: Date.now().toString(), text: inputText, isUser: true };
                const updated = [...messages, userMsg];
                setMessages(updated);
                setInputText('');
                setLoading(true);

                try {
                    if (!apiKey.trim()) {
                        throw new Error("الرجاء إدخال مفتاح Google Gemini API Key في صفحة الملف الشخصي والإعدادات أولاً!");
                    }

                    const apiMessages = [
                        { role: 'system', content: `اسم المستخدم الحالي هو: ${userPersonaName}. خلفية المستخدم وصفاته: ${userPersonaDesc}\n\nتعليمات الشخصية الأساسية: ${activeChat.systemPrompt}` },
                        ...updated.map(m => ({ role: m.isUser ? 'user' : 'model', parts: [{ text: m.text }] }))
                    ];

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey.trim()}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: apiMessages })
                    });
                    const data = await res.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، حدث خطأ في الاتصال أو انتهت صلاحية المفتاح.";
                    setMessages(prev => [...prev, { id: Date.now().toString(), text: reply, isUser: false }]);
                } catch (err) {
                    setMessages(prev => [...prev, { id: Date.now().toString(), text: `⚠️ خطأ: ${err.message}`, isUser: false }]);
                } finally {
                    setLoading(false);
                }
            };

            const handleCreateBot = (e) => {
                e.preventDefault();
                if (!botName.trim() || !botPrompt.trim()) return alert('الرجاء كتابة اسم البوت ومواصفاته على الأقل.');
                const newChar = {
                    id: Date.now().toString(),
                    name: botName,
                    avatar: botAvatar.trim() || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80',
                    systemPrompt: botPrompt,
                    firstMessage: botFirstMsg.trim() || 'أهلاً بك!',
                    category: 'مخصص',
                    tags: ['#OC', '#Rpg'],
                    stats: '💎 1.2K'
                };
                setCharacters([newChar, ...characters]);
                setBotName(''); setBotAvatar(''); setBotPrompt(''); setBotFirstMsg('');
                setCurrentTab('explore');
                alert('تم إنشاء البوت بنجاح! 🎉');
            };

            return (
                <div className="flex-1 flex flex-col pb-20">
                    <header className="flex items-center justify-between px-6 py-4 border-b border-[#231b35] bg-[#120f1d]/80 backdrop-blur sticky top-0 z-40">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                                <i className="fa-solid fa-wand-magic-sparkles text-white"></i>
                            </div>
                            <span className="text-xl font-black bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">إيثيريا AI</span>
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4">
                        {currentTab === 'explore' && (
                            <div className="space-y-6">
                                <div className="p-6 rounded-2xl bg-gradient-to-r from-purple-900/40 to-pink-900/40 border border-purple-500/20 text-center space-y-3">
                                    <h1 className="text-2xl font-black text-purple-200">اختر شخصيتك المفضلة وابدأ التحدث الآن</h1>
                                    <p className="text-sm text-purple-300/80">تحدث مع شخصيات الأنمي والفانتازيا، أو صمم شخصيتك الخاصة بكل سهولة!</p>
                                    <button onClick={() => setCurrentTab('create-bot')} className="px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition shadow-lg shadow-purple-600/30">
                                        <i className="fa-solid fa-plus ml-2"></i> صمم بوت جديد
                                    </button>
                                </div>

                                <h2 className="text-lg font-bold text-purple-200 flex items-center gap-2">
                                    <i className="fa-solid fa-compass text-pink-400"></i> الشخصيات المتاحة
                                </h2>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {characters.map(char => (
                                        <div key={char.id} className="p-4 rounded-2xl bg-[#171324] border border-[#261f38] flex flex-col justify-between gap-4 hover:border-purple-500/40 transition">
                                            <div className="flex items-center gap-4">
                                                <img src={char.avatar} alt={char.name} className="w-16 h-16 rounded-2xl object-cover border border-purple-500/30" />
                                                <div>
                                                    <h3 className="font-bold text-base text-white">{char.name}</h3>
                                                    <span className="text-xs text-purple-400 font-semibold">{char.stats || '💎 1.5K'}</span>
                                                    <p className="text-xs text-gray-400 line-clamp-2 mt-1">{char.systemPrompt}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between pt-2 border-t border-[#231b35]">
                                                <div className="flex gap-1">
                                                    {char.tags?.map((t, i) => <span key={i} className="text-[10px] bg-purple-950/60 text-purple-300 px-2 py-0.5 rounded-full">{t}</span>)}
                                                </div>
                                                <button onClick={() => startChat(char)} className="px-4 py-2 rounded-xl bg-purple-600/30 hover:bg-purple-600 text-purple-200 hover:text-white text-xs font-bold transition">
                                                    بدء المحادثة
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {currentTab === 'create-bot' && (
                            <form onSubmit={handleCreateBot} className="space-y-4 max-w-lg mx-auto bg-[#171324] p-6 rounded-2xl border border-[#261f38]">
                                <h2 className="text-xl font-bold text-purple-200 mb-4 text-center">تصميم شخصية بوت جديدة</h2>
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">اسم الشخصية</label>
                                    <input type="text" value={botName} onChange={e => setBotName(e.target.value)} placeholder="مثلاً: كابتن دريك" className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500" required />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">رابط صورة الأفاتار (URL)</label>
                                    <input type="text" value={botAvatar} onChange={e => setBotAvatar(e.target.value)} placeholder="https://..." className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500" />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">مواصفات الشخصية والسيناريو (System Prompt)</label>
                                    <textarea value={botPrompt} onChange={e => setBotPrompt(e.target.value)} rows="4" placeholder="كيف تتكلم الشخصية، خلفيتها، وقصتها..." className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500" required></textarea>
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">رسالة الترحيب الأولى</label>
                                    <input type="text" value={botFirstMsg} onChange={e => setBotFirstMsg(e.target.value)} placeholder="مرحباً! كيف يمكنني مساعدتك؟" className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500" />
                                </div>
                                <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-sm shadow-lg shadow-purple-600/30">حفظ ونشر البوت</button>
                            </form>
                        )}

                        {currentTab === 'profile' && (
                            <div className="space-y-6 max-w-lg mx-auto bg-[#171324] p-6 rounded-2xl border border-[#261f38]">
                                <h2 className="text-xl font-bold text-purple-200 text-center">الملف الشخصي والإعدادات</h2>
                                
                                <div className="p-4 rounded-xl bg-purple-950/40 border border-purple-500/40 space-y-2">
                                    <label className="text-xs font-bold text-purple-300 block">🔑 Google Gemini API Key (مفتاح التشغيل)</label>
                                    <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="الصق مفتاح API هنا..." className="w-full bg-[#100d18] border border-purple-500/50 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-400" />
                                    <p className="text-[11px] text-gray-400">الصقي المفتاح الذي نسختيه هنا لكي تعمل جميع البوتات معكِ فوراً.</p>
                                </div>

                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">اسمك في المحادثات</label>
                                    <input type="text" value={userPersonaName} onChange={e => setUserPersonaName(e.target.value)} className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500" />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 block mb-1">صفات وخلفية شخصيتك (حتى 20,000 حرف)</label>
                                    <textarea value={userPersonaDesc} onChange={e => setUserPersonaDesc(e.target.value)} rows="5" className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500"></textarea>
                                </div>
                                <div className="flex items-center justify-between p-3 bg-[#100d18] rounded-xl border border-[#2a223f]">
                                    <span className="text-sm font-bold text-purple-200">وضع الرسائل ومحتوى (18+)</span>
                                    <input type="checkbox" checked={allow18} onChange={e => setAllow18(e.target.checked)} className="w-5 h-5 accent-purple-600 rounded" />
                                </div>
                                <button onClick={handleSaveProfile} className="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm shadow-lg shadow-purple-600/30">حفظ التغييرات</button>

                                <div className="pt-6 border-t border-[#231b35] space-y-3">
                                    <h3 className="text-sm font-bold text-purple-200">البلاغات والشكاوى</h3>
                                    <select value={complaintType} onChange={e => setComplaintType(e.target.value)} className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white">
                                        <option>خطأ تقني أو برمجية</option>
                                        <option>سلوك الشخصية</option>
                                        <option>اقتراح تحسين</option>
                                    </select>
                                    <textarea value={complaintText} onChange={e => setComplaintText(e.target.value)} rows="3" placeholder="اكتب تفاصيل البلاغ هنا..." className="w-full bg-[#100d18] border border-[#2a223f] rounded-xl p-3 text-sm text-white"></textarea>
                                    <button onClick={() => { setComplaintSent(true); setTimeout(() => setComplaintSent(false), 3000); setComplaintText(''); }} className="w-full py-2.5 rounded-xl bg-[#261f38] hover:bg-purple-950 text-purple-200 text-xs font-bold transition">إرسال البلاغ</button>
                                    {complaintSent && <p className="text-xs text-green-400 text-center font-bold">تم إرسال بلاغك بنجاح!</p>}
                                </div>
                            </div>
                        )}

                        {currentTab === 'chat' && (
                            <div className="flex flex-col h-[75vh] bg-[#120f1d] rounded-2xl border border-[#231b35] overflow-hidden">
                                <div className="flex items-center justify-between p-4 bg-[#171324] border-b border-[#231b35]">
                                    <div className="flex items-center gap-3">
                                        <img src={activeChat.avatar} className="w-10 h-10 rounded-full object-cover border border-purple-500/30" />
                                        <div>
                                            <span className="font-bold text-sm text-white block">{activeChat.name}</span>
                                            <span className="text-[10px] text-purple-400 font-semibold">{activeChat.category || 'محادثات النشطة'}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => setCurrentTab('explore')} className="px-3 py-1.5 rounded-xl bg-[#231b35] hover:bg-purple-900 text-xs text-purple-200">تغيير البوت</button>
                                </div>
